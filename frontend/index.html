<!DOCTYPE html>
<!--
  Manual-testing UI for the cup-app API.

  No build step on purpose (this machine has an old Node version, and we
  don't need a bundler for a tiny test tool): React, ReactDOM and Babel are
  loaded from CDNs, and app.jsx is transpiled in the browser.

  How to run:
    1. Start the API from the repo root:  uv run fastapi dev main.py
    2. Open http://127.0.0.1:8000/ — main.py mounts this folder at "/",
       so the API and this UI are served from the same FastAPI app.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cup App — Manual Test UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React + ReactDOM (UMD builds, no npm install required) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel standalone transpiles our JSX directly in the browser.
         Pinned to the 7.x line: unversioned unpkg URLs resolve to whatever
         is "latest", and @babel/standalone 8 defaults the react preset to
         the "automatic" JSX runtime, which emits `import "react/jsx-runtime"`
         — invalid in a classic (non-module) script and exactly what causes
         a blank page with "Cannot use import statement outside a module". -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>

    <script>
      // Fetch + transpile app.jsx ourselves instead of relying on Babel's
      // automatic <script type="text/babel" src="..."> scanning, so we can
      // force the "classic" JSX runtime (React.createElement, using the
      // global React/ReactDOM above) regardless of Babel's default runtime.
      fetch("app.jsx")
        .then((res) => res.text())
        .then((source) => {
          const { code } = Babel.transform(source, {
            presets: [["react", { runtime: "classic" }]],
            filename: "app.jsx",
          });
          const script = document.createElement("script");
          script.text = code;
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
